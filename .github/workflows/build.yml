name: Atomica release

on:
  push:
    tags:
      - 'v*\+atomica.*'

permissions:
  contents: read

jobs:
  build:
    name: Build and install distributions
    uses: ./.github/workflows/_build-package.yml
    with:
      cache-package: true
      upload-package: true
      test-files: true
      test-imports: true

  verify:
    name: Verify packaged chemistry
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prolif-package
          path: dist
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - name: Install released wheel
        run: |
          uv venv
          uv pip install dist/*.whl 'rdkit==2025.9.6' pytest
      - name: Test installed wheel outside source checkout
        run: |
          mkdir -p "$RUNNER_TEMP/prolif-tests"
          cp tests/test_connected_parent.py "$RUNNER_TEMP/prolif-tests/"
          cd "$RUNNER_TEMP/prolif-tests"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest -q test_connected_parent.py

  publish:
    name: Publish GitHub Release assets
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prolif-package
          path: dist
      - name: Publish distributions and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: dist
        run: |
          sha256sum *.whl *.tar.gz > SHA256SUMS
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "ProLIF ${GITHUB_REF_NAME#v}" --notes "Atomica's ProLIF fork. See ATOMICA.md in the repository for changes and installation instructions."
          fi
          gh release upload "$GITHUB_REF_NAME" ./*.whl ./*.tar.gz SHA256SUMS
